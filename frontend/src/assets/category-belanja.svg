      stroke-width="13"
      stroke-linecap="round"
      stroke-linejoin="round"/>

  </g>

  <!-- Brand -->
  <text
    x="380"
    y="385"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="12"
    font-weight="700"
    fill="white">
    Serbabisa<tspan fill="#C8FF00">.id</tspan>
  </text>

  <!-- ================= SHOPPING CART ================= -->

  <!-- Cart Handle -->
  <path
    d="M85 270
       H125
       L145 350"
    stroke="#263342"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Cart Basket -->
  <path
    d="M125 290
       H225
       L210 350
       H145Z"
    fill="#C8FF00"/>

  <!-- Basket Lines -->
  <path
    d="M140 305H220
       M145 325H215
       M150 345H210"
    stroke="#9BC900"
    stroke-width="4"
    stroke-linecap="round"/>

  <!-- Cart Wheels -->
  <circle
    cx="155"
    cy="365"
    r="13"
    fill="#263342"/>

  <circle
    cx="205"
    cy="365"
    r="13"
    fill="#263342"/>

  <circle
    cx="155"
    cy="365"
    r="5"
    fill="#DCE2E7"/>

  <circle
    cx="205"
    cy="365"
    r="5"
    fill="#DCE2E7"/>

  <!-- ================= GROCERIES ================= -->

  <!-- Apple -->
  <circle
    cx="160"
    cy="275"
    r="15"
    fill="#FF4A4A"/>

  <path
    d="M160 260
       Q165 252 172 255"
    stroke="#348A3C"
    stroke-width="5"
    stroke-linecap="round"/>

  <!-- Milk -->
  <path
    d="M180 265
       H200
       V295
       H180Z"
    fill="white"/>

  <path
    d="M180 265L185 258H195L200 265"
    fill="#168BFF"/>

  <!-- Vegetable -->
  <path
    d="M205 280
       Q220 265 232 280
       Q220 295 205 280Z"
    fill="#39B85A"/>

  <path
    d="M215 270L220 260"
    stroke="#24853B"
    stroke-width="4"
    stroke-linecap="round"/>

  <!-- Shopping Sparkles -->
  <path
    d="M105 215V235
       M95 225H115"
    stroke="url(#lime)"
    stroke-width="6"
    stroke-linecap="round"/>

  <path
    d="M405 215V230
       M398 222H412"
    stroke="url(#lime)"
    stroke-width="5"
    stroke-linecap="round"/>

</svg>
