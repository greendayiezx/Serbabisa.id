<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512"
     fill="none">

  <defs>
    <linearGradient id="blue" x1="80" y1="120" x2="430" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#168BFF"/>
      <stop offset="1" stop-color="#0057D9"/>
    </linearGradient>

    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E5FF45"/>
      <stop offset="1" stop-color="#A8E900"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse
    cx="256"
    cy="420"
    rx="175"
    ry="18"
    fill="#000"
    opacity=".10"/>

  <!-- Moving Truck Body -->
  <path
    d="M78 170
       Q78 150 98 150
       H330
       Q345 150 350 166
       L390 245
       H420
       Q440 245 440 265
       V365
       H78Z"
    fill="url(#blue)"/>

  <!-- Truck Cargo Box -->
  <rect
    x="78"
    y="150"
    width="272"
    height="215"
    rx="12"
    fill="url(#blue)"/>

  <!-- Cargo Door -->
  <rect
    x="100"
    y="174"
    width="228"
    height="165"
    rx="8"
    fill="#0874E8"/>

  <!-- Cargo Door Lines -->
  <path
    d="M214 174V339"
    stroke="#54B8FF"
    stroke-width="4"
    opacity=".7"/>

  <path
    d="M100 255H328"
    stroke="#54B8FF"
    stroke-width="4"
    opacity=".45"/>

  <!-- Serbabisa Logo -->
  <g transform="translate(170 205)">
    <path
      d="M35 0
         L70 28
         L42 53
         L22 37
         L42 20
         L36 16
         L10 38
         L37 63
         L70 35"
      stroke="white"
      stroke-width="13"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <path
      d="M38 28
         L60 46
         L37 65
         L20 51"
      stroke="url(#lime)"
      stroke-width="13"
      stroke-linecap="round"
      stroke-linejoin="round"/>
  </g>

  <!-- Brand -->
  <text
    x="214"
    y="310"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="22"
    font-weight="700"
    fill="white">
    Serbabisa<tspan fill="#C8FF00">.id</tspan>
  </text>

  <!-- Truck Cabin -->
  <path
    d="M350 245
       H390
       L420 275
       V365
       H350Z"
    fill="#0065D8"/>

  <!-- Windshield -->
  <path
    d="M360 260
       H385
       L405 280
       H360Z"
    fill="#BDEBFF"/>

  <!-- Cabin Window -->
  <path
    d="M360 288
       H408
       V330
       H360Z"
    fill="#C9F0FF"/>

  <!-- Window Reflection -->
  <path
    d="M365 292L390 292L365 318Z"
    fill="white"
    opacity=".5"/>

  <!-- Door Handle -->
  <rect
    x="370"
    y="340"
    width="20"
    height="5"
    rx="2.5"
    fill="#C8FF00"/>

  <!-- Headlight -->
  <rect
    x="414"
    y="315"
    width="13"
    height="25"
    rx="5"
    fill="#FFE45C"/>

  <!-- Front Bumper -->
  <path
    d="M405 365H445"
    stroke="#202936"
    stroke-width="13"
    stroke-linecap="round"/>

  <!-- Rear Wheel -->
  <circle cx="145" cy="365" r="42" fill="#17202B"/>
  <circle cx="145" cy="365" r="27" fill="#6D7782"/>
  <circle cx="145" cy="365" r="14" fill="#DCE2E7"/>
  <circle cx="145" cy="365" r="6" fill="#525D68"/>

  <!-- Front Wheel -->
  <circle cx="382" cy="365" r="42" fill="#17202B"/>
  <circle cx="382" cy="365" r="27" fill="#6D7782"/>
  <circle cx="382" cy="365" r="14" fill="#DCE2E7"/>
  <circle cx="382" cy="365" r="6" fill="#525D68"/>

  <!-- Boxes Being Moved -->
  <g transform="translate(95 92)">

    <!-- Box 1 -->
    <path
      d="M0 35L45 15L90 35L45 55Z"
      fill="#E6A85C"/>

    <path
      d="M0 35V85L45 105V55Z"
      fill="#C9823C"/>

    <path
      d="M90 35V85L45 105V55Z"
      fill="#D99348"/>

    <!-- Tape -->
    <path
      d="M40 18L50 22V97L40 93Z"
      fill="#F4D27A"/>

  </g>

  <g transform="translate(170 70)">

    <!-- Box 2 -->
    <path
      d="M0 35L45 15L90 35L45 55Z"
      fill="#F0B96E"/>

    <path
      d="M0 35V85L45 105V55Z"
      fill="#C98542"/>

    <path
      d="M90 35V85L45 105V55Z"
      fill="#DD9A50"/>

    <!-- Tape -->
    <path
      d="M40 18L50 22V97L40 93Z"
      fill="#F5D580"/>

  </g>

  <!-- Small Moving Arrows -->
  <path
    d="M72 395H42"
    stroke="url(#lime)"
    stroke-width="8"
    stroke-linecap="round"/>

  <path
    d="M52 383L40 395L52 407"
    stroke="url(#lime)"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <path
    d="M440 395H470"
    stroke="url(#lime)"
    stroke-width="8"
    stroke-linecap="round"/>

  <path
    d="M460 383L472 395L460 407"
    stroke="url(#lime)"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"/>

</svg>
