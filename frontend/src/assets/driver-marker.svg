<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 650"
     width="900"
     height="650"
     fill="none">

  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#168BFF"/>
      <stop offset="1" stop-color="#0057D9"/>
    </linearGradient>

    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E5FF45"/>
      <stop offset="1" stop-color="#A8E900"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse
    cx="450"
    cy="585"
    rx="300"
    ry="22"
    fill="#000"
    opacity=".12"/>

  <!-- Delivery Box -->
  <rect
    x="125"
    y="245"
    width="285"
    height="230"
    rx="25"
    fill="url(#blue)"/>

  <!-- Box Top -->
  <path
    d="M125 275
       Q125 245 155 245
       H380
       Q410 245 410 275
       V305
       H125Z"
    fill="#0872E8"/>

  <!-- Box Straps -->
  <rect x="165" y="240" width="20" height="55" rx="7" fill="#65D5FF"/>
  <rect x="350" y="240" width="20" height="55" rx="7" fill="#65D5FF"/>

  <!-- Box Logo -->
  <g transform="translate(205 315)">
    <path
      d="M70 0
         L105 30
         L75 55
         L55 38
         L75 22
         L70 18
         L42 40
         L70 65
         L105 35"
