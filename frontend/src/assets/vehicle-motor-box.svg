<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512"
     fill="none">

  <defs>
    <linearGradient id="blue" x1="130" y1="130" x2="390" y2="390"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#168BFF"/>
      <stop offset="1" stop-color="#0057D9"/>
    </linearGradient>

    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E5FF45"/>
      <stop offset="1" stop-color="#A8E900"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <ellipse cx="260" cy="420" rx="155" ry="15"
           fill="#000" opacity=".10"/>

  <!-- ================= MOTOR BOX ================= -->

  <!-- Rear Delivery Box -->
  <path
    d="M105 155
       Q105 145 115 145
       H245
       Q255 145 255 155
       V275
       Q255 285 245 285
       H115
       Q105 285 105 275Z"
    fill="url(#blue)"/>

  <!-- Box Top -->
  <path
    d="M105 155
       L175 125
       L255 155
       L185 185Z"
    fill="#0874E8"/>

  <!-- Box Side Highlight -->
  <path
    d="M120 175V260"
    stroke="#54B8FF"
    stroke-width="7"
    stroke-linecap="round"
    opacity=".7"/>

  <!-- Box Door Line -->
  <path
    d="M185 185V285"
    stroke="#0051B9"
    stroke-width="5"/>

  <!-- Box Lock -->
  <rect x="174" y="225"
        width="22"
        height="30"
        rx="5"
        fill="#C8FF00"/>

  <rect x="179" y="232"
        width="12"
        height="16"
        rx="3"
        fill="#0872E8"/>

  <!-- Serbabisa Logo -->
  <g transform="translate(135 185) scale(.62)">

    <path
      d="M35 0
         L70 28
         L42 53
         L22 37
         L42 20
         L36 16
         L10 38
         L37 63
         L70 35"
      stroke="white"
      stroke-width="13"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <path
      d="M38 28
         L60 46
         L37 65
         L20 51"
      stroke="url(#lime)"
      stroke-width="13"
      stroke-linecap="round"
      stroke-linejoin="round"/>

  </g>

  <!-- Brand -->
  <text x="180" y="270"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14"
        font-weight="700"
        fill="white">
    Serbabisa<tspan fill="#C8FF00">.id</tspan>
  </text>

  <!-- ================= MOTOR BODY ================= -->

  <!-- Rear Body -->
  <path
    d="M185 300
       Q205 265 250 280
       L320 320
       L335 365
       H175Z"
