  <!-- Seat -->
  <path
    d="M190 285
       Q225 265 265 285
       L305 305
       H205
       Q185 305 180 295Z"
    fill="#202B38"/>

  <!-- Front Body -->
  <path
    d="M300 285
       Q335 255 370 280
       L395 345
       H340
       L310 315Z"
    fill="url(#blue)"/>

  <!-- Front Shield -->
  <path
    d="M335 280
       Q360 260 380 282
       L395 330
       L350 340
       L325 305Z"
    fill="#0878EA"/>

  <!-- Headlight -->
  <ellipse cx="378" cy="282"
           rx="14" ry="19"
           fill="#FFE45C"/>

  <ellipse cx="378" cy="282"
           rx="7" ry="11"
           fill="white"
           opacity=".8"/>

  <!-- Handlebar -->
  <path
    d="M310 260
       L338 238
       L380 248"
    stroke="#202936"
    stroke-width="9"
    stroke-linecap="round"/>

  <!-- Mirrors -->
  <path
    d="M338 240L325 216"
    stroke="#202936"
    stroke-width="6"
    stroke-linecap="round"/>

  <path
    d="M378 248L393 222"
    stroke="#202936"
    stroke-width="6"
    stroke-linecap="round"/>

  <ellipse cx="324" cy="213"
           rx="9" ry="13"
           fill="#252D38"/>

  <ellipse cx="395" cy="219"
           rx="9" ry="13"
           fill="#252D38"/>

  <!-- Rear Wheel -->
  <circle cx="220" cy="375" r="43"
          fill="#17202B"/>

  <circle cx="220" cy="375" r="28"
          fill="#68737E"/>

  <circle cx="220" cy="375" r="14"
          fill="#DCE2E7"/>

  <circle cx="220" cy="375" r="6"
          fill="#505A65"/>

  <!-- Front Wheel -->
  <circle cx="370" cy="375" r="43"
          fill="#17202B"/>

  <circle cx="370" cy="375" r="28"
          fill="#68737E"/>

  <circle cx="370" cy="375" r="14"
          fill="#DCE2E7"/>

  <circle cx="370" cy="375" r="6"
          fill="#505A65"/>

  <!-- Rear Mudguard -->
  <path
    d="M180 355
       Q220 315 260 355"
    stroke="#0872E8"
    stroke-width="12"
    stroke-linecap="round"/>

  <!-- Front Mudguard -->
  <path
    d="M335 355
       Q370 320 405 355"
    stroke="#0872E8"
    stroke-width="12"
    stroke-linecap="round"/>

  <!-- Foot Rest -->
  <path
    d="M255 345H315"
    stroke="#263342"
    stroke-width="9"
    stroke-linecap="round"/>

  <!-- Tail Light -->
  <path
    d="M175 305L158 315L175 325L190 315Z"
    fill="#FF3D3D"/>

  <!-- Lime Accent -->
  <path
    d="M205 315
       Q245 330 285 315"
    stroke="url(#lime)"
    stroke-width="7"
    stroke-linecap="round"/>

</svg>
